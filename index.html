<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partner Brief · Loading</title>
<style>body{font-family:sans-serif;padding:24px;color:#333}</style>
</head>
<body>
<p id="s">載入中，請稍候…</p>
<script>
const BASE = "https://raw.githubusercontent.com/ermamaster-create/thailand-mask-brief/main/";
const GN = 3, QN = 4;
async function go() {
  const parts = [];
  for (let i = 0; i < GN; i++) {
    for (let q = 0; q < QN; q++) {
      const r = await fetch(BASE + "g" + i + "q" + q + ".txt", {cache: "no-store"});
      if (!r.ok) throw new Error("g" + i + "q" + q + " HTTP " + r.status);
      parts.push(await r.text());
    }
  }
  const bin = Uint8Array.from(atob(parts.join("")), c => c.charCodeAt(0));
  const ds = new DecompressionStream("gzip");
  const stream = new Blob([bin]).stream().pipeThrough(ds);
  const html = await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
}
go().catch(e => {
  document.getElementById("s").textContent = "載入失敗：" + e;
});
</script>
</body>
</html>
