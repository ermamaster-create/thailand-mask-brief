<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>タイ市場　火災避難用呼吸防護マスク</title></head><body>
<script>
(async function(){
  const files = ['p0.b64','p1.b64','p2.b64','p3.b64'];
  const parts = await Promise.all(files.map(f => fetch(f).then(r => { if(!r.ok) throw new Error(f+':'+r.status); return r.text(); })));
  const b64 = parts.join('').replace(/\s+/g,'');
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const html = await new Response(new Response(bin).body.pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
})().catch(e => { document.body.textContent = 'Load failed: ' + e; });
</script>
<noscript>Enable JavaScript</noscript>
</body></html>
